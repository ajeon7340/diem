# Hosted auth configuration, as code.
#
# `supabase config push` writes ONLY the properties this file declares and
# leaves everything else on the project untouched — so this file deliberately
# declares nothing but the two URL settings. Do not let `supabase init` rewrite
# it with its full template: the template carries a local-development site_url
# and a pile of disabled toggles, and pushing those non-interactively would
# overwrite real hosted settings that nobody meant to change.
project_id = "ukkcrkkakvabpnwdkasb"

[auth]
# Where a magic link lands. Without this the link points at whatever Supabase
# was last told, which on a fresh project is http://localhost:3000 — so every
# link mailed to a real user sends them to their own machine.
site_url = "https://diem-git-main-abe7340-gmailcoms-projects.vercel.app"

# The allowlist the callback is checked against. A link whose redirect is not
# on this list is refused at /auth/callback — the mail arrives and sign-in
# still fails, which is the confusing half of this setting.
additional_redirect_urls = [
  "https://diem-git-main-abe7340-gmailcoms-projects.vercel.app/auth/callback",
  "https://diem-git-main-abe7340-gmailcoms-projects.vercel.app/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/**",
]

# NOT settable from here: `auth.rate_limit.email_sent` comes back from
# `config diff` as `unmanaged`, so `config push` ignores it. Raising the limit
# would not have helped anyway — the built-in service stays a testing
# convenience whatever the number says. The block below is the only real fix.

# --- Mail -------------------------------------------------------------------
#
# Supabase's built-in email service is a testing convenience, not a mailer. It
# allows roughly two messages an hour per project and, on newer projects, only
# to addresses belonging to the Supabase organisation. Past that:
#
#     429  over_email_send_rate_limit  "email rate limit exceeded"
#
# which is what "Could not send the link" was on the deployment. No amount of
# retrying clears it and nothing about the app is wrong — sign-in simply cannot
# work for real users until a provider is configured.
#
# Gmail SMTP, chosen because it needs no new account and no DNS: 2-Step
# Verification on the Google account, then an App Password from
# https://myaccount.google.com/apppasswords . 500 messages a day, which is
# several orders of magnitude past what the built-in service allows.
#
# The password is referenced as env(...) so it stays out of this file and out
# of git; `supabase config push` sends it as a secret. Set SMTP_PASSWORD in the
# environment (it is in .env.local, which is gitignored) before pushing.
#
# admin_email must be the same Gmail address as `user`. Gmail rewrites the
# From header to the authenticated account regardless of what is asked for, so
# a different sender here would only make the config disagree with the mail.
#
# Until a real domain is verified somewhere else, this is what makes sign-in
# work at all. `npm run dev:session -- <handle>@demo.adfit.invalid` remains the
# way in without sending anything.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "ajjeon7340@gmail.com"
pass = "env(SMTP_PASSWORD)"
admin_email = "ajjeon7340@gmail.com"
sender_name = "adfit"
